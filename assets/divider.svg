      <stop offset="0" stop-color="#8B949E" stop-opacity="0"/><stop offset="0.15" stop-color="#8B949E" stop-opacity="0.35"/>
      <stop offset="0.85" stop-color="#8B949E" stop-opacity="0.35"/><stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
