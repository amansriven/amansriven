<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.45"/><stop offset="0.8" stop-color="#F472B6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#base)"/>
  <rect x="-160" y="4.5" width="160" height="3" rx="1.5" fill="url(#spark)" filter="url(#g)">
    <animate attributeName="x" values="-160;1200" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <rect x="-160" y="5.25" width="160" height="1.5" fill="url(#spark)">
    <animate attributeName="x" values="-160;1200" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
</svg>